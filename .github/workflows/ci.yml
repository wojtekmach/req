name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      REQ_ADAPTERS: finch,mint,plug
    continue-on-error: ${{ matrix.test_args == '--only integration' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "25"
          - elixir: "1.20"
            otp: "29"
            test_args: "--warnings-as-errors"
          - elixir: "1.20"
            otp: "29"
            test_args: "--warnings-as-errors --only integration"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@main
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v5
        with:
          path: deps
          key: mix-otp-${{ steps.beam.outputs.otp-version }}-deps-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get --check-locked

      - run: mix deps.compile

      - run: mix test.adapters --slowest 5 ${{ matrix.test_args }}

  lint:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@main
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v5
        with:
          path: deps
          key: mix-otp-${{ steps.beam.outputs.otp-version }}-deps-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get --check-locked

      - run: mix format --check-formatted

      - run: mix deps.unlock --check-unused

      - run: mix deps.compile

      - run: mix compile --no-optional-deps --warnings-as-errors
